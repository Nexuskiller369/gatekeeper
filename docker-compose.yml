services:
  postgres:
    image: postgres:16-alpine
    container_name: gatekeeper-postgres
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
      POSTGRES_DB: gatekeeper
    ports:
      - "5433:5432"   # 5433 on the host so it never clashes with a locally installed Postgres
    volumes:
      - gatekeeper-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  gatekeeper-pgdata:
